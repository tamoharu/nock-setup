[package]
name = "hati-tui"
version = "0.1.0"
edition = "2021"
description = "Herdr-derived terminal client for the shared hati workspace"
license = "AGPL-3.0-or-later"

[dependencies]
crossterm = "=0.29.0"
ratatui = { version = "=0.30.0", features = ["unstable-rendered-line-info"] }
portable-pty = "=0.9.0"
vt100 = "=0.16.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
unicode-width = "=0.2.2"
signal-hook = "=0.3.18"

[profile.release]
strip = true
